name: Release

# Push a tag like v0.2.0 (matching package.json's version) to publish a release with the
# app tarball and install.sh as assets.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Public-readiness check
        run: node scripts/public-readiness.ts
      - name: Build the tarball
        run: scripts/package.sh dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/rocket-explainer-*.tar.gz install.sh --title "$GITHUB_REF_NAME" --generate-notes
